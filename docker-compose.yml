# lightcloud — gerado pelo Light Cloud (menu Deploy)
# O build roda no GitLab (job lightcloud-build) e a VM só baixa as imagens. Portas e variáveis
# de ambiente ficam no painel: a cada deploy ele grava um compose.lightcloud.yml ao lado deste.
services:
  app:
    build:
      context: "."
      dockerfile: Dockerfile
    image: "${LC_REGISTRY:-lightcloud}/match-de-curriculos-api-app:${LC_TAG:-latest}"
    restart: unless-stopped
